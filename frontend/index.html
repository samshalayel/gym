<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silver GYM</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --font-heading: 'Bebas Neue', 'Tajawal', sans-serif;
      --font-body: 'Archivo', 'Tajawal', 'Noto Kufi Arabic', sans-serif;
      --bg-primary: #08080e;
      --bg-secondary: #0e0e18;
      --bg-card: rgba(14, 14, 24, 0.85);
      --accent: #00f5d4;
      --accent-glow: rgba(0, 245, 212, 0.25);
      --accent-secondary: #ffd60a;
      --text-primary: #e8e8f0;
      --text-secondary: #6b6b80;
      --danger: #ff3355;
      --danger-glow: rgba(255, 51, 85, 0.2);
      --success: #00f593;
      --border: rgba(255, 255, 255, 0.06);
      --radius: 12px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    html { font-size: 16px; }
    html[dir="rtl"] {
      --font-heading: 'Tajawal', 'Bebas Neue', sans-serif;
      --font-body: 'Tajawal', 'Noto Kufi Arabic', 'Archivo', sans-serif;
    }
    body {
      font-family: var(--font-body);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 99999;
      opacity: 0.5;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-heading);
      letter-spacing: 0.02em;
      line-height: 1.1;
    }
    input, select, button, textarea { font-family: var(--font-body); }
    select {
      background-color: #071426 !important;
      color: #f4f7ff !important;
      color-scheme: dark;
    }
    option, optgroup {
      background-color: #071426;
      color: #f4f7ff;
    }
    option:checked, option:hover {
      background-color: #0d63ce;
      color: #ffffff;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }
    ::selection { background: var(--accent); color: var(--bg-primary); }
    @keyframes slideIn {
      from { transform: translateX(100px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px var(--accent-glow); }
      50% { box-shadow: 0 0 40px var(--accent-glow), 0 0 60px var(--accent-glow); }
    }
    @keyframes noise {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-5%, -5%); }
      20% { transform: translate(-10%, 5%); }
      30% { transform: translate(5%, -10%); }
      40% { transform: translate(-5%, 15%); }
      50% { transform: translate(-10%, 5%); }
      60% { transform: translate(15%, 0); }
      70% { transform: translate(0, 10%); }
      80% { transform: translate(-15%, 0); }
      90% { transform: translate(10%, 5%); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
